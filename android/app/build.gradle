plugins { id 'com.android.application' }
android {
    namespace 'co.korevia.eloquent'
    compileSdk 35
    defaultConfig {
        applicationId 'co.korevia.eloquent'
        minSdk 26
        targetSdk 34
        versionCode System.getenv('GITHUB_RUN_NUMBER') ? System.getenv('GITHUB_RUN_NUMBER').toInteger() : 1
        versionName '1.0.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
        ndk { abiFilters 'arm64-v8a' }
    }
    signingConfigs {
        release {
            def ks = System.getenv('EP_KEYSTORE_PATH')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('EP_KEYSTORE_PASSWORD')
                keyAlias System.getenv('EP_KEY_ALIAS')
                keyPassword System.getenv('EP_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig System.getenv('EP_KEYSTORE_PATH') ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    androidResources { noCompress 'wav', 'mdl', 'fst', 'int', 'conf', 'bin', 'mat', 'dubm', 'ie', 'stats', 'txt' }
    packaging { jniLibs { useLegacyPackaging true } }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.alphacephei:vosk-android:0.3.47'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
}
